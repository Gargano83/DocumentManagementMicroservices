resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: apigateway-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - IDENTITYSERVICE_HTTP=http://identityservice:8080
    - services__identityservice__http__0=http://identityservice:8080
    - DOCUMENTSERVICE_HTTP=http://documentservice:8080
    - services__documentservice__http__0=http://documentservice:8080
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=apigateway
    - ASPNETCORE_URLS=http://+:8080;

