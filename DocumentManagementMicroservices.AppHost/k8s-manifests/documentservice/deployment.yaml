---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentservice
  labels:
    app: documentservice
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: documentservice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: documentservice
    spec:
      containers:
      - name: documentservice
        image: documentservice:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: documentservice-env
        - secretRef:
            name: documentservice-secrets
      terminationGracePeriodSeconds: 180